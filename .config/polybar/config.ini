[colors]
; Nord palette + Hyprland-waybar translucent feel
bg        = #cc2e3440
bg-solid  = #2e3440
bg-alt    = #3b4252
fg        = #d8dee9
fg-dark   = #2e3440
muted     = #4c566a

blue      = #88c0d0
blue-dim  = #81a1c1
cyan      = #8fbcbb
green     = #a3be8c
yellow    = #ebcb8b
orange    = #d08770
red       = #bf616a
purple    = #b48ead

[bar/main]
; Top floating bar like Hyprland waybar
bottom = false
width = 98%
height = 34pt
offset-x = 1%
offset-y = 6
radius = 12

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 0
border-size = 0

padding-left = 2
padding-right = 2
module-margin = 1

dpi-x = 96
dpi-y = 96

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"

modules-left = launcher xworkspaces
modules-center = date
modules-right = tray battery brightness volume network cpu memory powermenu

enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[module/launcher]
type = custom/script
exec = echo " 󰀻 "
interval = 86400
click-left = ~/.config/i3/scripts/control-center.sh
format-foreground = ${colors.blue}

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.blue-dim}
label-active-foreground = ${colors.fg-dark}
label-active-padding = 2
label-active-radius = 8

label-occupied = %name%
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1

date = %b %d  %H:%M
label = " %date%"
label-foreground = ${colors.cyan}
click-left = kitty --hold sh -c "cal; read"

[module/tray]
type = internal/tray
tray-spacing = 8
tray-padding = 4

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC0}
poll-interval = 10

format-charging    = " <label-charging>"
format-discharging = "<ramp-capacity> <label-discharging>"
format-full        = "<ramp-capacity> <label-full>"

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full        = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

format-charging-foreground    = ${colors.yellow}
format-discharging-foreground = ${colors.green}

[module/brightness]
type = custom/script
exec = ~/.config/polybar/brightness.sh get
interval = 2

format = " <label>"
label = %output%
format-foreground = ${colors.yellow}

scroll-up = ~/.config/polybar/brightness.sh up
scroll-down = ~/.config/polybar/brightness.sh down

[module/volume]
type = internal/pulseaudio

format-volume = " <label-volume>"
format-muted  = " muted"

label-volume = %percentage%%
label-muted-foreground = ${colors.muted}

format-volume-foreground = ${colors.purple}

click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/network]
type = internal/network
interface = ${env:POLYBAR_NETWORK:wlp2s0}
interval = 3

format-connected = "󰤨 <label-connected>"
format-disconnected = "󰤭 <label-disconnected>"
label-connected = %essid%
label-disconnected = "offline"
format-connected-foreground = ${colors.blue}
format-disconnected-foreground = ${colors.red}

[module/cpu]
type = internal/cpu
interval = 2
format = " <label>"
label = %percentage:2%%
format-foreground = ${colors.orange}

[module/memory]
type = internal/memory
interval = 3
format = " <label>"
label = %percentage_used%%
format-foreground = ${colors.green}

[module/powermenu]
type = custom/script
exec = echo "  "
interval = 86400
click-left = ~/.config/i3/scripts/powermenu.sh
format-foreground = ${colors.red}

[settings]
screenchange-reload = true
pseudo-transparency = true
