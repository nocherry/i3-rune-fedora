# Picom config for Fedora i3 — smooth shadows, blur, fade, rounded corners.
# NOTE: true "window open/close animations" need picom-animations fork,
#       which is not packaged for Fedora by default. We use fade + shadows
#       + corners + blur for a Hyprland-like feel.

backend = "glx";

# Shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# Transparency / opacity
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Dim inactive windows slightly
inactive-dim = 0.05;

# Corners
corner-radius = 10;

# Blur
blur: {
  method = "dual_kawase";
  strength = 3;
  background = true;
  background-frame = false;
  background-fixed = false;
}

# VSync
vsync = true;

# Performance
use-damage = true;
xrender-sync-fence = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
detect-rounded-corners = true;

# Exclude docks, menus, etc from shadows / corners
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "_GTK_FRAME_EXTENTS@"
];

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];

fade-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'Dunst'"
];

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "_GTK_FRAME_EXTENTS@"
];

opacity-rule = [
    "100:class_g = 'firefox' && focused",
    "100:class_g = 'Brave-browser' && focused",
    "95:class_g = 'kitty' && !focused"
];

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.85; focus = true; full-shadow = false; corner-radius = 4; };
    dock = { shadow = false; clip-shadow-above = true; corner-radius = 0; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; fade = true; };
    dropdown_menu = { opacity = 0.95; fade = true; };
    menu = { opacity = 0.95; fade = true; };
    dialog = { opacity = 0.98; };
    notification = { opacity = 0.95; corner-radius = 8; };
};

log-level = "warn";
