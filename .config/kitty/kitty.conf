font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 10.0
window_padding_width 25
include theme.conf
cursor_trail 1
background_opacity 0.9

# Copy/paste on both US and RU layouts
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+с       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard
map ctrl+shift+м       paste_from_clipboard

# Tab bar styling and mappings
include tabs.conf

# initially empty, to be configured by user and remains static
include userprefs.conf

# Note: as userprefs.conf is included at the end, settings configured in this file will override the defaults
