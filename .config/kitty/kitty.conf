font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
enable_audio_bell no
font_size 10.0
window_padding_width 25
include theme-current.conf
cursor_trail 1
# ponytail: keep background opaque so screenshots stay readable (no picom blur merge)
# background_opacity 0.9

# Copy/paste on both US and RU layouts (lowercase and shifted cyrillic)
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+C       copy_to_clipboard
map ctrl+shift+с       copy_to_clipboard
map ctrl+shift+С       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard
map ctrl+shift+V       paste_from_clipboard
map ctrl+shift+м       paste_from_clipboard
map ctrl+shift+М       paste_from_clipboard

# Layout-independent fallback using Insert key
map ctrl+insert        copy_to_clipboard
map shift+insert       paste_from_clipboard

# Tab bar styling and mappings
include tabs.conf

# initially empty, to be configured by user and remains static
include userprefs.conf

# Note: as userprefs.conf is included at the end, settings configured in this file will override the defaults
