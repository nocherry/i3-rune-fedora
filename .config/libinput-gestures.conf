# libinput-gestures config for i3/X11
# Requires: libinput-gestures package, user in 'input' group

# 3-finger swipe: switch workspaces

gesture swipe left 3  i3-msg workspace next
gesture swipe right 3 i3-msg workspace prev

# 3-finger swipe up: window overview via rofi
gesture swipe up 3    i3-msg exec "rofi -show window"

# 3-finger swipe down: toggle scratchpad
gesture swipe down 3  i3-msg scratchpad show

# 4-finger tap: screenshot area
gesture tap 4         ~/.config/i3/scripts/screenshot.sh area

# Pinch: volume control
gesture pinch out 2   pactl set-sink-volume @DEFAULT_SINK@ +5%
gesture pinch in 2    pactl set-sink-volume @DEFAULT_SINK@ -5%
