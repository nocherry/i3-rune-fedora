# libinput-gestures config for i3/X11
# Requires: libinput-gestures and permission to read input devices

# 3-finger swipe: switch workspaces
swipe_threshold 300
timeout 0.9

gesture swipe left 3  /usr/bin/i3-msg workspace next
gesture swipe right 3 /usr/bin/i3-msg workspace prev

# 3-finger swipe up: all windows from every workspace
gesture swipe up 3    /usr/bin/rofi -show window -show-icons -window-thumbnail -window-format "{w}  {c}  {t}" -display-window "Все окна" -theme ~/.config/rofi/launcher.rasi

# 3-finger swipe down: toggle scratchpad
gesture swipe down 3  /usr/bin/i3-msg scratchpad show

# Pinch: volume control
gesture pinch out 2   /usr/bin/pactl set-sink-volume @DEFAULT_SINK@ +5%
gesture pinch in 2    /usr/bin/pactl set-sink-volume @DEFAULT_SINK@ -5%
