[greenclip]
  history_file = "@HOME@/.cache/greenclip.history"
  max_history_length = 50
  max_selection_size_bytes = 10485760
  trim_space_from_selection = true
  use_primary_selection_as_input = false
  blacklisted_applications = ["KeePassXC", "Bitwarden", "1Password", "Handy", "handy"]
  enable_image_support = true
  image_cache_directory = "@HOME@/.cache/greenclip-images"
  static_history = []
